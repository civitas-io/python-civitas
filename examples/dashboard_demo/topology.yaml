# civitas top dashboard demo (v0.9.1) — deliberately noisy/colorful, not a
# realistic workload. See README.md in this directory for how to run it.
#
# v0.9.3.5: also feeds civitas/observability/sqlite_backend.py's SQLiteBackend
# (via plugins.exporters:, resolved as a dotted import path -- no built-in
# "sqlite" exporter name is registered, matching civitas.plugins.loader's own
# documented resolution order) -- one demo topology now serves civitas top,
# the Grafana/Prometheus stack (examples/observability/grafana/), AND
# `civitas telemetry`, all from the same live run.
plugins:
  exporters:
    - type: civitas.observability.sqlite_backend.SQLiteBackend
      config:
        db_dir: ./civitas_telemetry_demo

supervision:
  name: root
  strategy: ONE_FOR_ONE
  max_restarts: 20
  restart_window: 60.0
  children:
    - type: topology_server
      name: topo_server
      config:
        host: 127.0.0.1
        port: 6789

    - type: examples.dashboard_demo.agents.ChattyWorker
      name: chatty

    - type: examples.dashboard_demo.agents.FlakyWorker
      name: flaky

    - type: dynamic_supervisor
      name: workers
      max_children: 10

    - type: examples.dashboard_demo.agents.SpawnerAgent
      name: spawner

    - type: examples.dashboard_demo.agents.ApprovalWorker
      name: approval_worker

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["civitas"]

[project]
name = "civitas"
version = "0.6.1"
description = "The production runtime for Python agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["agents", "multi-agent", "runtime", "ai", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "msgpack>=1.2.1",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13",
]

[project.urls]
Homepage = "https://civitas-io.github.io/python-civitas/"
Repository = "https://github.com/civitas-io/python-civitas"
Documentation = "https://civitas-io.github.io/python-civitas/"
"Bug Tracker" = "https://github.com/civitas-io/python-civitas/issues"

[project.optional-dependencies]
# Runtime transports
zmq       = ["pyzmq>=25"]
nats      = ["nats-py>=2.6"]
nkeys     = ["nats-py>=2.6", "nkeys>=0.2"]
# HTTP gateway
http      = ["uvicorn[standard]>=0.30", "pydantic>=2.0"]
http3     = ["uvicorn[standard]>=0.30", "pydantic>=2.0", "aioquic>=1.0"]
# gRPC gateway
grpc      = [
    "grpcio>=1.78,<2",
    "grpcio-reflection>=1.78,<2",
    "grpcio-health-checking>=1.78,<2",
]
# Gateway JWT bearer auth (PyJWT extra is 'crypto', which pulls in cryptography for RS256)
jwt       = ["pyjwt[crypto]>=2.13"]
# Observability (OTEL exporter backend)
otel      = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]
# Transport-level message signing
security  = ["pynacl"]
# Encrypted state store at rest (ChaCha20-Poly1305 AEAD)
encryption = ["cryptography>=41"]
# Performance — drop-in Rust-backed JSON (accelerates JsonSerializer)
fast      = ["orjson>=3.10"]
# Model providers, state stores, eval exporters, MCP, and framework adapters
# have moved to civitas-contrib:  pip install civitas-contrib[anthropic,openai,...]
dev       = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "types-pyyaml>=6.0.12",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.13",
    "grpcio>=1.78,<2",
    "grpcio-reflection>=1.78,<2",
    "grpcio-health-checking>=1.78,<2",
    "grpcio-tools>=1.78,<2",
    "orjson>=3.10",
    "cryptography>=41",
]
docs      = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-gen-files>=0.5",
]

[project.scripts]
civitas = "civitas.cli:main"

[dependency-groups]
dev = [
    "pynacl>=1.6.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
addopts = "--cov=civitas --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
omit = [
    # Requires live infra (ZMQ IPC/TCP, NATS server) — covered in test_m2_1/m2_2
    "*/civitas/transport/zmq.py",
    "*/civitas/transport/nats.py",
    "*/civitas/transport/__init__.py",   # protocol definition only
    # Require live API keys — unit-tested via mocks
    "*/civitas/plugins/anthropic.py",
    "*/civitas/plugins/openai.py",
    "*/civitas/plugins/gemini.py",
    "*/civitas/plugins/mistral.py",
    "*/civitas/plugins/litellm.py",
    # Fiddler plugin stub (implementation is in civitas/eval/exporters.py)
    "*/civitas/plugins/fiddler.py",
    # SQLite store and tools — deferred to a dedicated plugin testing sprint
    "*/civitas/plugins/sqlite_store.py",
    "*/civitas/plugins/tools.py",
    # CLI — deferred to a dedicated CLI testing sprint using CliRunner
    "*/civitas/cli/*",
    # Adapters — require third-party frameworks (crewai, langgraph, openai)
    "*/civitas/adapters/*",
    # Dashboard — requires live runtime for meaningful testing
    "*/civitas/dashboard/*",
    # MCP integration — branches that open stdio subprocesses / SSE sessions
    # require live MCP server processes; covered by integration tests, not unit
    "*/civitas/mcp/client.py",
    "*/civitas/mcp/server.py",
    # Entry point shim
    "*/civitas/__main__.py",
    # HTTP/3 — requires aioquic which is not installed in the dev environment
    "*/civitas/gateway/h3.py",
    # Generated protobuf/gRPC stubs — machine-generated, not our code
    "*/civitas/gateway/proto/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    # Protocol method stubs — never executed, only used for type checking
    "^\\s+\\.\\.\\.$",
    # Safety-net __del__ destructors — GC-triggered, non-deterministic
    "def __del__",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Generated protobuf/gRPC stubs are machine-authored; don't lint or format them.
extend-exclude = ["civitas/gateway/proto/"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "ASYNC",
]
ignore = [
    "E501",
    # ASYNC109: timeout as a named parameter is intentional public API for ask()/request().
    # Callers pass it as a kwarg; using asyncio.timeout() internally is already done.
    "ASYNC109",
    # B008: typer.Option() in function defaults is idiomatic Typer usage.
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["civitas"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["msgpack.*", "zmq.*", "nats.*", "nkeys", "nkeys.*", "litellm.*", "openai.*", "google", "google.*", "mistralai.*", "mcp.*", "aioquic", "aioquic.*", "uvicorn", "uvicorn.*", "nacl", "nacl.*", "asyncpg", "asyncpg.*", "grpc", "grpc.*", "grpc_health.*", "grpc_reflection.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Generated protobuf/gRPC stubs — machine-generated, not authored to strict standards
module = ["civitas.gateway.proto.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# civitas-contrib and fabrica are optional sibling packages — not installed in the core dev env
module = ["civitas_contrib", "civitas_contrib.*", "fabrica", "fabrica.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Eval exporter SDKs: optional installs, no stubs bundled with the packages
module = ["langfuse", "langfuse.*", "braintrust", "braintrust.*", "langsmith", "langsmith.*", "fiddler", "fiddler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# OtlpSink calls internal opentelemetry SDK APIs whose typing varies across patch versions.
# type: ignore comments here may be needed on some versions and unused on others.
module = ["civitas.audit.sinks"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["agents", "agents.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Gemini and Mistral plugin files: third-party stubs don't fully match the
# runtime API (missing explicit exports, nullable SDK types). Ignore errors
# so strict mode doesn't block commits for issues we can't fix upstream.
module = ["civitas.plugins.gemini", "civitas.plugins.mistral"]
ignore_errors = true

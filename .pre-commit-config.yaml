repos:
  # -----------------------------------------------------------------------
  # File hygiene
  # -----------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]   # mkdocs.yml uses !ENV and !!python/name: tags
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: debug-statements   # catch leftover breakpoint() / pdb calls

  # -----------------------------------------------------------------------
  # Lint + format (ruff replaces flake8, isort, pyupgrade)
  # -----------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # -----------------------------------------------------------------------
  # Secret scanning
  # -----------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # -----------------------------------------------------------------------
  # Type checking + tests -- local hooks via `uv run`, not the mirrors-mypy
  # pre-commit repo. Real, deliberate choice (2026-08-24): a separately
  # pinned mypy version (mirrors-mypy's own `rev`, with a hand-maintained
  # `additional_dependencies` list) can drift from the real mypy version
  # this project's own uv.lock actually pins and tests against in CI --
  # `uv run mypy` always uses the exact same mypy/dependency versions CI
  # does, with zero duplicated version-pinning to keep in sync.
  # -----------------------------------------------------------------------
  - repo: local
    hooks:
      - id: mypy
        name: mypy (civitas)
        # --python 3.12, pinned to match CI's own "mypy" job exactly (ci.yml runs
        # mypy on 3.12 only, not the full 3.12/3.13/3.14 test matrix) -- a real,
        # confirmed finding while setting this hook up: `uv run mypy civitas/`
        # with no pin resolves to whatever Python `uv` picks locally (3.14 here),
        # which produces 14 real, false-positive pyzmq/mypy stub errors on
        # civitas/transport/zmq.py that do NOT reproduce on 3.12 -- confirmed by
        # running both side by side, not assumed.
        # --frozen: use the committed uv.lock as-is, don't let switching to
        # --python 3.12 trigger a real re-resolution/lockfile rewrite as a
        # side effect of every commit (confirmed real: without --frozen, this
        # hook mutated uv.lock locally on every run and pre-commit reported
        # a false "Failed" for it, even though mypy itself passed cleanly).
        entry: uv run --frozen --python 3.12 --extra dev --extra otel --extra dashboard mypy civitas/
        language: system
        pass_filenames: false
        files: ^civitas/
        types: [python]

      - id: tests
        name: tests (civitas)
        entry: uv run --frozen --extra dev --extra otel --extra dashboard pytest -x -q --no-header --tb=line --no-cov
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]

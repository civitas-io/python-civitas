name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra otel

      - name: Run tests with coverage
        run: uv run pytest

  # A gate that doesn't run is indistinguishable from a gate that passes (#39):
  # the integration suite rotted silently for months because nothing executed it.
  # Runs the full tests/integration tree — in-process (~2s) + real-ZMQ (~10s).
  # NATS tests self-guard (skip when nats-server is not on PATH — server binary
  # install deferred, see #39); contrib-dependent tests self-guard via
  # importorskip. pytest exits nonzero on any failure OR collection error, so
  # import rot like #40 fails this job immediately.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra otel --extra zmq --extra nats

      # G1 (v0.8.2): the NATS integration tests spawn a real nats-server binary
      # from PATH (a service container does not satisfy them). Without this,
      # 13 tests skip — the last remnant of the #39 fail-open class. Pinned
      # release + checksum; no third-party setup action (supply-chain surface).
      - name: Install nats-server
        run: |
          NATS_VERSION=v2.14.3
          NATS_SHA256=f3d0c820c749f81d717310fb00d4903919e70e3e66b268bd352a088b9788eb93
          curl -sSL -o /tmp/nats.tar.gz \
            "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz"
          echo "${NATS_SHA256}  /tmp/nats.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nats.tar.gz -C /tmp
          sudo mv "/tmp/nats-server-${NATS_VERSION}-linux-amd64/nats-server" /usr/local/bin/
          nats-server --version

      - name: Run integration tests
        env:
          # Rich/Typer render --help at terminal width with ANSI styling; the
          # CLI console is created at import time, so width/color must be fixed
          # via environment before Python starts. Without this, option names
          # wrap inside box-drawing at the runner's narrow default and the
          # help-text assertions fail (first-run catch of this very gate).
          COLUMNS: "200"
          NO_COLOR: "1"
          TERM: dumb
        run: uv run pytest tests/integration --no-cov -p no:cacheprovider -q -ra

  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra otel

      - name: Ruff lint
        run: uv run ruff check civitas/

      - name: Ruff format check
        run: uv run ruff format --check civitas/

      - name: mypy
        run: uv run mypy civitas/

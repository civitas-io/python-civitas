name: Security

on:
  push:
    branches: ["main", "master"]
  pull_request:
  schedule:
    # Full scan weekly on Monday at 08:00 UTC (catches new CVEs against unchanged code)
    - cron: "0 8 * * 1"

jobs:
  # ---------------------------------------------------------------------------
  # SAST — Bandit (Python-native) + Semgrep (pattern-based)
  # Fails the build on any HIGH or CRITICAL finding.
  # ---------------------------------------------------------------------------
  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to GitHub Security tab

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Bandit
        run: uv tool install bandit

      - name: Bandit — fail on HIGH+ severity
        # -lll = minimum severity HIGH
        # -iii = minimum confidence HIGH
        # Excludes test files (assert usage, subprocess calls in tests are expected)
        run: |
          uv tool run bandit \
            -r civitas/ \
            -lll -iii \
            --format json \
            --output bandit-report.json \
            || true
          uv tool run bandit \
            -r civitas/ \
            -lll -iii

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bandit-report
          path: bandit-report.json

      # Invoked via CLI, not semgrep/semgrep-action: the action dropped the
      # generateSarif input (valid inputs are now entryPoint/args/config/
      # publishToken), so semgrep.sarif was silently never produced and the
      # SARIF upload below became a no-op — a fail-open in the SAST pipeline.
      - name: Semgrep — Python security + secrets ruleset
        run: |
          uv tool install semgrep
          uv tool run semgrep scan \
            --config p/python \
            --config p/secrets \
            --config p/owasp-top-ten \
            --sarif --output semgrep.sarif \
            --severity ERROR --error
        env:
          # SEMGREP_APP_TOKEN is optional — set in repo secrets for dashboard
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true   # SARIF upload is best-effort; don't fail CI

  # ---------------------------------------------------------------------------
  # Dependency audit — pip-audit against PyPI Advisory Database
  # Fails on any vulnerability with a fix available.
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra otel

      - name: pip-audit
        # --strict: fail on any vulnerability with a fix available
        # --desc: include vulnerability description in output
        run: |
          uv tool install pip-audit
          uv tool run pip-audit \
            --strict \
            --desc \
            --format columns \
            -r <(uv export --format requirements-txt --no-dev --no-emit-project 2>/dev/null)

  # ---------------------------------------------------------------------------
  # Secret scanning — TruffleHog on full commit history
  # Catches secrets committed at any point, not just the current tree.
  # 700+ detectors with active API verification (confirms secrets are live).
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0   # full history required for historical secret scan

      # Pinned, not @main: on 2026-08-10 the scheduled run failed with 59
      # "verified" findings, all from the Lob detector, on ordinary test code
      # (assertions/docstrings, nothing secret-shaped) — a confirmed,
      # currently-open TruffleHog bug: the Lob detector treats HTTP 422/403
      # verification responses as success and has no entropy check, so it
      # matches snake_case identifiers of the right length and "verifies"
      # them via a broken check. @main and the latest tagged release
      # (v3.96.0) were IDENTICAL at the time — pinning a version doesn't
      # retroactively fix this incident, it prevents a future unreviewed
      # regression from landing silently the same way this one did.
      - name: TruffleHog — scan full history
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          extra_args: --results=verified --exclude-detectors=Lob
          # TODO: remove --exclude-detectors=Lob once upstream fixes the
          # 422/403-treated-as-verified bug and adds an entropy check to the
          # Lob keyPat. Re-enable by removing the flag, not by re-pinning to
          # @main.

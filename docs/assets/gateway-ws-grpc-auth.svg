<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <linearGradient id="httpH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#475569"/></linearGradient>
    <linearGradient id="wsH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1e40af"/></linearGradient>
    <linearGradient id="grpcH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="arRed" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b91c1c"/></marker>
    <marker id="arGreen" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#047857"/></marker>
  </defs>
  <rect width="1100" height="640" fill="url(#bg)"/>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Gateway Auth — Closing the WS/gRPC Gap (#17)</text>
  <text x="550" y="58" text-anchor="middle" font-size="13" fill="#64748b">Same JwtVerifier + DN-allowlist, auto-inherited from verifier/client_cert_mode presence — no new config</text>

  <!-- HTTP column (existing, reference) -->
  <rect x="40" y="90" width="300" height="34" rx="7" fill="url(#httpH)"/>
  <text x="190" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">HTTP (existing, R3)</text>
  <rect x="40" y="140" width="300" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="168" font-size="12.5" fill="#334155">1. Request arrives at ASGI</text>
  <text x="60" y="192" font-size="12.5" fill="#334155">2. build_chain() runs global</text>
  <text x="72" y="210" font-size="12.5" fill="#334155">+ route-scoped middleware</text>
  <rect x="55" y="228" width="270" height="46" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="70" y="246" font-size="12" font-weight="700" fill="#991b1b">require_jwt / require_client_cert</text>
  <text x="70" y="262" font-size="11.5" fill="#991b1b">fail-closed: 401 / 403 / 500</text>
  <text x="60" y="298" font-size="12.5" fill="#334155">3. contract validation</text>
  <text x="60" y="320" font-size="12.5" fill="#334155">4. bus dispatch (ask/send)</text>
  <rect x="55" y="340" width="270" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
  <text x="70" y="365" font-size="12" fill="#065f46">✓ Protected today — the working case</text>

  <!-- WS column (new) -->
  <rect x="400" y="90" width="300" height="34" rx="7" fill="url(#wsH)"/>
  <text x="550" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">WebSocket (NEW — D1/D2)</text>
  <rect x="400" y="140" width="300" height="330" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="415" y="168" font-size="12.5" fill="#1e3a8a">1. Upgrade request arrives</text>
  <text x="415" y="188" font-size="11.5" fill="#1e3a8a">(JWT-only — WS mTLS deferred, see #25)</text>
  <rect x="412" y="204" width="276" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="425" y="222" font-size="12" font-weight="700" fill="#1e40af">Extract bearer token from</text>
  <text x="425" y="238" font-size="11.5" fill="#1e40af">Sec-WebSocket-Protocol header</text>
  <text x="425" y="254" font-size="11.5" fill="#1e40af">pinned: "civitas.bearer.&lt;jwt&gt;"</text>
  <path d="M550,264 v18" stroke="#1e40af" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="412" y="284" width="276" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="425" y="304" font-size="12" font-weight="700" fill="#991b1b">verify() — JWT only</text>
  <text x="425" y="320" font-size="11.5" fill="#991b1b">BEFORE websocket.accept</text>
  <path d="M470,334 v14" stroke="#b91c1c" stroke-width="2" marker-end="url(#arRed)"/>
  <text x="418" y="360" font-size="11.5" fill="#991b1b">fail → close(4401)</text>
  <path d="M630,334 v14" stroke="#047857" stroke-width="2" marker-end="url(#arGreen)"/>
  <text x="555" y="356" font-size="11.5" fill="#065f46">ok → accept, bridge frames</text>
  <text x="555" y="372" font-size="11" fill="#047857">(echoes subprotocol)</text>
  <rect x="412" y="410" width="276" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="425" y="435" font-size="12" fill="#991b1b">✗ Unauthenticated today — the gap</text>

  <!-- gRPC column (new) -->
  <rect x="760" y="90" width="300" height="34" rx="7" fill="url(#grpcH)"/>
  <text x="910" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">gRPC (NEW — D3/D4)</text>
  <rect x="760" y="140" width="300" height="330" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="775" y="168" font-size="12.5" fill="#065f46">1. RPC arrives (Invoke/Cast/Stream)</text>
  <rect x="772" y="184" width="276" height="46" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <text x="785" y="202" font-size="12" font-weight="700" fill="#065f46">add_secure_port +</text>
  <text x="785" y="218" font-size="11.5" fill="#065f46">root_certificates, require_client_auth=True</text>
  <path d="M910,230 v14" stroke="#047857" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="772" y="248" width="276" height="96" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="785" y="266" font-size="12" font-weight="700" fill="#991b1b">ServerInterceptor</text>
  <text x="785" y="282" font-size="11.5" font-style="italic" fill="#991b1b">Health/Reflection RPCs exempt (D3)</text>
  <text x="785" y="298" font-size="11.5" fill="#991b1b">authorization metadata → verify()</text>
  <text x="785" y="314" font-size="11.5" fill="#991b1b">auth_context() x509_pem_cert →</text>
  <text x="785" y="330" font-size="11.5" fill="#991b1b">_dn_from_pem() → DN</text>
  <path d="M840,344 v14" stroke="#b91c1c" stroke-width="2" marker-end="url(#arRed)"/>
  <text x="850" y="362" font-size="11.5" fill="#991b1b">fail → abort UNAUTHENTICATED</text>
  <path d="M985,344 v14" stroke="#047857" stroke-width="2" marker-end="url(#arGreen)"/>
  <text x="940" y="378" font-size="11.5" fill="#065f46">ok → _AgentServicer dispatch</text>
  <rect x="772" y="410" width="276" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="785" y="435" font-size="12" fill="#991b1b">✗ Unauthenticated today — the gap</text>

  <!-- shared box -->
  <rect x="220" y="500" width="660" height="98" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="550" y="524" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5b21b6">D5 — One shared core, three thin adapters</text>
  <text x="550" y="546" text-anchor="middle" font-size="12" fill="#5b21b6">JwtVerifier.verify(token) — already transport-agnostic (jwt_auth.py)</text>
  <text x="550" y="566" text-anchor="middle" font-size="12" fill="#5b21b6">_check_dn(dn, allowed) — extracted from mtls.py, shared by HTTP/gRPC</text>
  <text x="550" y="586" text-anchor="middle" font-size="12" fill="#5b21b6">_dn_from_pem(pem) — cert leaf PEM → DN string, shared by gRPC (future HTTP/WS via #25)</text>
  <path d="M190,470 L400,540" stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M550,470 L550,500" stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M910,470 L700,540" stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="3 3"/>

  <text x="550" y="618" text-anchor="middle" font-size="11.5" fill="#94a3b8">D6: enforcement auto-turns-on when a JWT verifier was built (self._jwt_verifier is not None, global OR route-scoped) or client_cert_mode != 'none' — no new YAML.</text>
  <text x="550" y="634" text-anchor="middle" font-size="11" fill="#b45309">D7 residual (documented, not silent): require_api_key-only deployments stay unauthenticated on WS/gRPC after this ships — now correctly detected as unenforced, not miscategorized as hardened.</text>
</svg>

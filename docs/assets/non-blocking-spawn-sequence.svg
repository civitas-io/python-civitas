<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Dynamic spawn — reply timing: <tspan fill="#b45309">wait=True</tspan> vs <tspan fill="#2d6a4f">wait=False</tspan></text>
  <text x="480" y="50" text-anchor="middle" font-size="12.5" fill="#6B7280">Same child lifecycle; only the moment the supervisor replies changes.</text>

  <!-- divider -->
  <line x1="480" y1="70" x2="480" y2="600" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ============ PANEL A: wait=True ============ -->
  <text x="240" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b45309">wait=True (default) — spawner blocks until ready</text>

  <!-- lifelines A -->
  <g>
    <rect x="28"  y="96" width="96" height="30" rx="5" fill="#1e3a5f"/>
    <text x="76"  y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Spawner</text>
    <rect x="176" y="96" width="112" height="30" rx="5" fill="#6b4c11"/>
    <text x="232" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">DynSupervisor</text>
    <rect x="352" y="96" width="96" height="30" rx="5" fill="#2d6a4f"/>
    <text x="400" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Child task</text>
    <line x1="76"  y1="126" x2="76"  y2="580" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="232" y1="126" x2="232" y2="580" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="400" y1="126" x2="400" y2="580" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- blocked bracket -->
  <rect x="60" y="150" width="32" height="252" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="76" y="280" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c" transform="rotate(-90 76 280)">BLOCKED</text>

  <!-- messages A -->
  <line x1="76" y1="160" x2="232" y2="160" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="154" y="153" text-anchor="middle" font-size="11" fill="#374151">spawn(...)</text>

  <line x1="232" y1="195" x2="400" y2="195" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="316" y="188" text-anchor="middle" font-size="11" fill="#374151">_start_nowait() → create_task</text>

  <!-- on_start activation A -->
  <rect x="391" y="205" width="18" height="150" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
  <text x="418" y="230" font-size="10.5" fill="#92400e">restore_state()</text>
  <text x="418" y="250" font-size="11" font-weight="700" fill="#92400e">on_start()</text>
  <text x="418" y="266" font-size="10.5" fill="#92400e">[slow I/O]</text>
  <text x="418" y="340" font-size="10.5" fill="#92400e">message_loop</text>
  <text x="400" y="372" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2d6a4f">RUNNING · event.set()</text>

  <line x1="400" y1="388" x2="232" y2="388" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="316" y="381" text-anchor="middle" font-size="11" fill="#374151">ready</text>

  <line x1="232" y1="418" x2="76" y2="418" stroke="#2d6a4f" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="154" y="411" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">ok (ready=true)</text>

  <text x="240" y="470" text-anchor="middle" font-size="11" fill="#6B7280">Spawner's handle() is stuck for the whole</text>
  <text x="240" y="486" text-anchor="middle" font-size="11" fill="#6B7280">on_start() — can't process other messages.</text>
  <text x="240" y="510" text-anchor="middle" font-size="11" fill="#166534">✓ on ok, child is RUNNING; ask() works now.</text>
  <text x="240" y="526" text-anchor="middle" font-size="11" fill="#166534">✓ on_start failure → synchronous error.</text>

  <!-- ============ PANEL B: wait=False ============ -->
  <text x="720" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2d6a4f">wait=False — reply once the task exists</text>

  <!-- lifelines B -->
  <g>
    <rect x="508" y="96" width="96" height="30" rx="5" fill="#1e3a5f"/>
    <text x="556" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Spawner</text>
    <rect x="656" y="96" width="112" height="30" rx="5" fill="#6b4c11"/>
    <text x="712" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">DynSupervisor</text>
    <rect x="832" y="96" width="96" height="30" rx="5" fill="#2d6a4f"/>
    <text x="880" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Child task</text>
    <line x1="556" y1="126" x2="556" y2="580" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="712" y1="126" x2="712" y2="580" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="880" y1="126" x2="880" y2="580" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- free bracket -->
  <rect x="540" y="235" width="32" height="167" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="556" y="318" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534" transform="rotate(-90 556 318)">FREE</text>

  <!-- messages B -->
  <line x1="556" y1="160" x2="712" y2="160" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="634" y="153" text-anchor="middle" font-size="11" fill="#374151">spawn(wait=False)</text>

  <line x1="712" y1="195" x2="880" y2="195" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="796" y="188" text-anchor="middle" font-size="11" fill="#374151">_start_nowait() → create_task</text>

  <line x1="712" y1="225" x2="556" y2="225" stroke="#2d6a4f" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="634" y="218" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">ok (ready=false)</text>

  <!-- on_start activation B (parallel) -->
  <rect x="871" y="205" width="18" height="150" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
  <text x="864" y="250" text-anchor="end" font-size="11" font-weight="700" fill="#92400e">on_start()</text>
  <text x="864" y="266" text-anchor="end" font-size="10.5" fill="#92400e">[slow I/O]</text>
  <text x="880" y="372" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2d6a4f">RUNNING</text>

  <!-- buffered ask -->
  <line x1="556" y1="285" x2="880" y2="285" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="700" y="278" text-anchor="middle" font-size="10.5" fill="#6B7280">ask() → buffers in mailbox</text>

  <line x1="880" y1="392" x2="556" y2="392" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="718" y="405" text-anchor="middle" font-size="10.5" fill="#166534">buffered msgs flush (FIFO) after RUNNING</text>

  <text x="720" y="470" text-anchor="middle" font-size="11" fill="#6B7280">Spawner keeps handling messages while the</text>
  <text x="720" y="486" text-anchor="middle" font-size="11" fill="#6B7280">child initialises in parallel.</text>
  <text x="720" y="510" text-anchor="middle" font-size="11" fill="#b91c1c">⚠ ok means "accepted", not "ready".</text>
  <text x="720" y="526" text-anchor="middle" font-size="11" fill="#b91c1c">⚠ on_start failure → on_child_terminated (async);</text>
  <text x="720" y="542" text-anchor="middle" font-size="11" fill="#b91c1c">buffered asks are failed, not hung.</text>
</svg>

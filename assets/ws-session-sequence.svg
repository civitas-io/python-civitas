<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- Participants -->
  <rect x="30" y="16" width="110" height="36" rx="6" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="85" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Client</text>
  <text x="85" y="47" text-anchor="middle" font-size="9" fill="#6B7280">(WebSocket)</text>

  <rect x="215" y="16" width="110" height="36" rx="6" fill="#1e3a5f"/>
  <text x="270" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="white">HTTPGateway</text>
  <text x="270" y="47" text-anchor="middle" font-size="9" fill="#93c5fd">(edge)</text>

  <rect x="385" y="16" width="110" height="36" rx="6" fill="#6b4c11"/>
  <text x="440" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="white">MessageBus</text>
  <text x="440" y="47" text-anchor="middle" font-size="9" fill="#fde68a">(routes)</text>

  <rect x="555" y="16" width="120" height="36" rx="6" fill="#2d6a4f"/>
  <text x="615" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="white">Agent</text>
  <text x="615" y="47" text-anchor="middle" font-size="9" fill="#a7f3d0">(handler)</text>

  <!-- Lifelines -->
  <line x1="85" y1="52" x2="85" y2="312" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="270" y1="52" x2="270" y2="312" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="440" y1="52" x2="440" y2="312" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="615" y1="52" x2="615" y2="312" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Step numbers -->
  <text x="12" y="95" font-size="9" font-weight="700" fill="#6B7280">1</text>
  <text x="12" y="137" font-size="9" font-weight="700" fill="#6B7280">2</text>
  <text x="12" y="179" font-size="9" font-weight="700" fill="#6B7280">3</text>
  <text x="12" y="215" font-size="9" font-weight="700" fill="#6B7280">4</text>
  <text x="12" y="253" font-size="9" font-weight="700" fill="#6B7280">5</text>
  <text x="12" y="291" font-size="9" font-weight="700" fill="#6B7280">6</text>

  <!-- 1: connect / accept -->
  <line x1="85" y1="92" x2="264" y2="92" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="177" y="86" text-anchor="middle" font-size="9" fill="#374151">websocket.connect → accept</text>
  <text x="177" y="104" text-anchor="middle" font-size="8" fill="#9CA3AF">allocate session id · register sink</text>

  <!-- 2: frame → cast → agent -->
  <line x1="85" y1="134" x2="264" y2="134" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="270" y1="134" x2="434" y2="134" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="440" y1="134" x2="609" y2="134" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="177" y="128" text-anchor="middle" font-size="9" fill="#374151">frame → cast(agent)</text>
  <text x="177" y="146" text-anchor="middle" font-size="8" fill="#9CA3AF">reply_to=gw · session id</text>

  <!-- 3: agent emit chunk → gateway (dashed) -->
  <line x1="615" y1="176" x2="446" y2="176" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <line x1="440" y1="176" x2="276" y2="176" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="446" y="170" text-anchor="middle" font-size="9" fill="#374151">emit chunk (session id)</text>

  <!-- 4: gateway → client frame (dashed, xN) -->
  <line x1="270" y1="212" x2="91" y2="212" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="177" y="206" text-anchor="middle" font-size="9" fill="#374151">websocket.send frame   (×N)</text>

  <!-- 5: disconnect -->
  <line x1="85" y1="250" x2="264" y2="250" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="177" y="244" text-anchor="middle" font-size="9" fill="#374151">websocket.disconnect</text>

  <!-- 6: gateway → agent close notice -->
  <line x1="270" y1="288" x2="609" y2="288" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="442" y="282" text-anchor="middle" font-size="9" fill="#374151">cast {"__session__": "closed"}</text>
  <text x="442" y="300" text-anchor="middle" font-size="8" fill="#9CA3AF">unregister sink · notify agent</text>
</svg>

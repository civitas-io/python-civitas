<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- Participants -->
  <rect x="30" y="16" width="110" height="36" rx="6" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="85" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Client</text>
  <text x="85" y="47" text-anchor="middle" font-size="9" fill="#6B7280">(consumer)</text>

  <rect x="215" y="16" width="110" height="36" rx="6" fill="#1e3a5f"/>
  <text x="270" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="white">HTTPGateway</text>
  <text x="270" y="47" text-anchor="middle" font-size="9" fill="#93c5fd">(edge)</text>

  <rect x="385" y="16" width="110" height="36" rx="6" fill="#6b4c11"/>
  <text x="440" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="white">MessageBus</text>
  <text x="440" y="47" text-anchor="middle" font-size="9" fill="#fde68a">(routes)</text>

  <rect x="555" y="16" width="120" height="36" rx="6" fill="#2d6a4f"/>
  <text x="615" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="white">Agent</text>
  <text x="615" y="47" text-anchor="middle" font-size="9" fill="#a7f3d0">(producer)</text>

  <!-- Lifelines -->
  <line x1="85" y1="52" x2="85" y2="340" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="270" y1="52" x2="270" y2="340" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="440" y1="52" x2="440" y2="340" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="615" y1="52" x2="615" y2="340" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Step numbers -->
  <text x="12" y="93" font-size="9" font-weight="700" fill="#6B7280">1</text>
  <text x="12" y="131" font-size="9" font-weight="700" fill="#6B7280">2</text>
  <text x="12" y="171" font-size="9" font-weight="700" fill="#6B7280">3</text>
  <text x="12" y="211" font-size="9" font-weight="700" fill="#6B7280">4</text>
  <text x="12" y="247" font-size="9" font-weight="700" fill="#6B7280">5</text>
  <text x="12" y="285" font-size="9" font-weight="700" fill="#6B7280">6</text>
  <text x="12" y="321" font-size="9" font-weight="700" fill="#6B7280">7</text>

  <!-- 1: GET /stream -->
  <line x1="85" y1="90" x2="264" y2="90" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="177" y="84" text-anchor="middle" font-size="9" fill="#374151">GET /stream   (route mode=stream)</text>

  <!-- 2: dispatch stream → agent -->
  <line x1="270" y1="128" x2="434" y2="128" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="440" y1="128" x2="609" y2="128" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="442" y="122" text-anchor="middle" font-size="9" fill="#374151">dispatch stream</text>
  <text x="442" y="140" text-anchor="middle" font-size="8" fill="#9CA3AF">reply_to=gw · correlation_id · marker</text>

  <!-- 3: response.start -->
  <line x1="270" y1="168" x2="91" y2="168" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="177" y="162" text-anchor="middle" font-size="9" fill="#374151">http.response.start</text>
  <text x="177" y="180" text-anchor="middle" font-size="8" fill="#9CA3AF">content-type: text/event-stream</text>

  <!-- 4: emit chunk → gateway (dashed) -->
  <line x1="615" y1="208" x2="446" y2="208" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <line x1="440" y1="208" x2="276" y2="208" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="442" y="202" text-anchor="middle" font-size="9" fill="#374151">emit chunk (×N)</text>

  <!-- 5: response.body more_body=true (dashed, xN) -->
  <line x1="270" y1="244" x2="91" y2="244" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="177" y="238" text-anchor="middle" font-size="9" fill="#374151">http.response.body  more_body=true</text>
  <text x="177" y="256" text-anchor="middle" font-size="8" fill="#9CA3AF">data: {…}    id: n</text>

  <!-- 6: terminator -->
  <line x1="615" y1="282" x2="276" y2="282" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="446" y="276" text-anchor="middle" font-size="9" fill="#374151">terminator</text>

  <!-- 7: response.body more_body=false -->
  <line x1="270" y1="318" x2="91" y2="318" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="177" y="312" text-anchor="middle" font-size="9" fill="#374151">http.response.body  more_body=false</text>
  <text x="177" y="330" text-anchor="middle" font-size="8" fill="#9CA3AF">stream closed</text>

  <!-- footnote -->
  <text x="360" y="360" text-anchor="middle" font-size="8" fill="#6B7280">gRPC Stream uses the same core — the servicer yields one AgentReply per chunk.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 668" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <linearGradient id="clientH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#475569"/></linearGradient>
    <linearGradient id="proxyH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1e40af"/></linearGradient>
    <linearGradient id="uviH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b7280"/><stop offset="1" stop-color="#4b5563"/></linearGradient>
    <linearGradient id="civBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0fdf4"/><stop offset="1" stop-color="#dcfce7"/></linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="arBlue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1e40af"/></marker>
    <marker id="arGreen" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#047857"/></marker>
  </defs>
  <rect width="1240" height="668" fill="url(#bg)"/>

  <!-- Header -->
  <text x="620" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">HTTP mTLS via Trusted Reverse Proxy (#25)</text>
  <text x="620" y="60" text-anchor="middle" font-size="13" fill="#64748b">Fix: move TLS client-cert termination in front of uvicorn — forward the cert via RFC 9440</text>

  <!-- Broken path (today, for context — de-emphasized) -->
  <rect x="40" y="78" width="1160" height="64" rx="9" fill="#fdf2f2" stroke="#e7a3a3" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="58" y="98" font-size="11" font-weight="700" fill="#b91c1c">✗ TODAY — direct mode (broken, shown for context)</text>
  <text x="58" y="118" font-size="12" fill="#991b1b">Client  —TLS + client cert→  uvicorn (ssl_cert_reqs = CERT_REQUIRED) — TLS handshake succeeds…</text>
  <text x="58" y="135" font-size="12" fill="#991b1b">…but scope['extensions']['tls'] is never populated by uvicorn (asgi.py) → require_client_cert always 401s ✗</text>

  <!-- The fix -->
  <text x="40" y="164" font-size="12.5" font-weight="700" fill="#047857">THE FIX — mtls_source = 'proxy_header'  ·  the working request flow</text>

  <!-- Band A: transport pipeline -->
  <!-- Client -->
  <rect x="40" y="180" width="130" height="28" rx="8" fill="url(#clientH)"/>
  <text x="105" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Client</text>
  <rect x="40" y="212" width="130" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="54" y="236" font-size="11.5" fill="#334155">Presents a TLS</text>
  <text x="54" y="252" font-size="11.5" fill="#334155">client certificate</text>
  <text x="54" y="274" font-size="11" font-style="italic" fill="#64748b">to the proxy</text>

  <path d="M170,252 L258,252" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <text x="214" y="244" text-anchor="middle" font-size="10" fill="#475569">TLS + client cert</text>

  <!-- Trusted Reverse Proxy -->
  <rect x="260" y="180" width="300" height="28" rx="8" fill="url(#proxyH)"/>
  <text x="410" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Trusted Reverse Proxy (TTRP)</text>
  <rect x="260" y="212" width="300" height="84" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="274" y="234" font-size="11.5" font-weight="700" fill="#1e40af">nginx · Envoy · Traefik</text>
  <text x="274" y="252" font-size="11.5" fill="#1e3a8a">terminates mTLS, validates vs own CA</text>
  <text x="274" y="270" font-size="11.5" fill="#1e3a8a">forwards RFC 9440 Client-Cert header</text>
  <text x="274" y="288" font-size="11" fill="#991b1b">strips any client-supplied one (§4)</text>

  <path d="M560,252 L698,252" stroke="#1e40af" stroke-width="2" marker-end="url(#arBlue)"/>
  <text x="629" y="234" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Client-Cert: :&lt;b64-DER&gt;:</text>
  <text x="629" y="247" text-anchor="middle" font-size="9.5" fill="#1e40af">(RFC 9440 Byte Sequence)</text>

  <!-- uvicorn -->
  <rect x="700" y="180" width="240" height="28" rx="8" fill="url(#uviH)"/>
  <text x="820" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">uvicorn</text>
  <rect x="700" y="212" width="240" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="714" y="234" font-size="11.5" font-weight="700" fill="#0f172a">proxy_headers = False</text>
  <text x="714" y="252" font-size="11.5" fill="#334155">keeps scope['client'] as the</text>
  <text x="714" y="268" font-size="11.5" fill="#334155">true TCP peer (Oracle B1 fix)</text>
  <text x="714" y="288" font-size="11" font-style="italic" fill="#64748b">plaintext/TLS hop — op. choice</text>

  <!-- wrap connector into civitas -->
  <path d="M820,296 L820,332 L140,332 L140,352" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <text x="470" y="326" text-anchor="middle" font-size="10" font-style="italic" fill="#64748b">request continues into civitas (in-process)</text>

  <!-- Band B: civitas GatewayASGI container -->
  <rect x="40" y="352" width="1160" height="190" rx="12" fill="url(#civBg)" stroke="#10b981" stroke-width="1.6"/>
  <text x="58" y="378" font-size="13.5" font-weight="700" fill="#065f46">civitas — GatewayASGI  ·  proxy_header request handling</text>

  <!-- D2 -->
  <rect x="56" y="392" width="250" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="70" y="414" font-size="12" font-weight="700" fill="#1e40af">D2 — trusted-CIDR check</text>
  <text x="70" y="436" font-size="11" fill="#1e3a8a">scope['client'][0] (true peer)</text>
  <text x="70" y="452" font-size="11" fill="#1e3a8a">in trusted_proxy_cidrs ?</text>
  <text x="70" y="474" font-size="10.5" fill="#991b1b">no → treated as no cert → 401</text>

  <path d="M306,442 L334,442" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <text x="320" y="434" text-anchor="middle" font-size="9.5" fill="#047857">yes</text>

  <!-- D5 -->
  <rect x="336" y="392" width="270" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="350" y="414" font-size="12" font-weight="700" fill="#1e40af">D5 — _client_cert_from_headers</text>
  <text x="350" y="436" font-size="11" fill="#1e3a8a">raw Client-Cert header,</text>
  <text x="350" y="452" font-size="11" fill="#1e3a8a">exactly one (RFC 9440 §2.2)</text>
  <text x="350" y="470" font-size="11" fill="#1e3a8a">b64decode(validate=True)→DER</text>
  <text x="350" y="486" font-size="10" fill="#991b1b">0 / &gt;1 / bad bytes → None (401)</text>

  <path d="M606,442 L634,442" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <text x="620" y="434" text-anchor="middle" font-size="9.5" fill="#475569">DER</text>

  <!-- D4 -->
  <rect x="636" y="392" width="250" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="650" y="414" font-size="12" font-weight="700" fill="#1e40af">D4 — _dn_from_cert</text>
  <text x="650" y="436" font-size="11" fill="#1e3a8a">load_der_x509_certificate</text>
  <text x="650" y="452" font-size="11" fill="#1e3a8a">.subject.rfc4514_string()</text>
  <text x="650" y="470" font-size="11" fill="#1e3a8a">→ subject DN string</text>
  <text x="650" y="487" font-size="10" font-style="italic" fill="#64748b">same formatter gRPC uses (R8)</text>

  <path d="M886,442 L914,442" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <text x="900" y="434" text-anchor="middle" font-size="9.5" fill="#475569">DN</text>

  <!-- _check_dn -->
  <rect x="916" y="392" width="268" height="100" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="930" y="413" font-size="12" font-weight="700" fill="#991b1b">_check_dn (R3/R8, unchanged)</text>
  <text x="930" y="428" font-size="8.5" fill="#7f1d1d">env: CIVITAS_GATEWAY_MTLS_ALLOWED_DNS</text>
  <text x="930" y="446" font-size="10" fill="#065f46">DN in allowlist → 200 ✓</text>
  <text x="930" y="461" font-size="10" fill="#991b1b">not in allowlist → 403</text>
  <text x="930" y="476" font-size="10" fill="#991b1b">no cert / trust fail → 401</text>
  <text x="930" y="490" font-size="10" fill="#b45309">allowlist empty (misconfig) → 500</text>

  <path d="M1050,492 L1050,506" stroke="#047857" stroke-width="2" marker-end="url(#arGreen)"/>

  <!-- working-case banner -->
  <rect x="56" y="506" width="1128" height="26" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="620" y="523" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">✓ this design's fix — the working case:  valid Client-Cert from a trusted CIDR, DN in allowlist  →  200, dispatch to the agent</text>

  <!-- Footer callout: key new decisions -->
  <rect x="40" y="556" width="770" height="94" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="60" y="580" font-size="13" font-weight="700" fill="#5b21b6">Key new decisions</text>
  <text x="60" y="602" font-size="11.5" fill="#5b21b6">D1  ·  opt-in mtls_source='proxy_header'  (default 'direct' = unchanged, still broken by #25)</text>
  <text x="60" y="624" font-size="11.5" fill="#5b21b6">D2  ·  proxy_headers=False + CIDR check — the Oracle-flagged fix for a spoofable peer IP</text>
  <text x="60" y="644" font-size="11.5" fill="#5b21b6">D9  ·  startup error if require_client_cert isn't wired to the middleware chain (no silent-open)</text>

  <!-- Non-goal callout -->
  <rect x="830" y="556" width="370" height="94" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="850" y="580" font-size="12" font-weight="700" fill="#b45309">Non-goal — fast-follow</text>
  <text x="850" y="604" font-size="11" fill="#92400e">WS mTLS via the same mechanism —</text>
  <text x="850" y="622" font-size="11" fill="#92400e">fast-follow, not in this design</text>
  <text x="850" y="640" font-size="11" fill="#92400e">(see #17).</text>
</svg>
